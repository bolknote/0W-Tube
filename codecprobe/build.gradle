plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH')

android {
    namespace = 'ru.tubetv.codecprobe'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.tubetv.codecprobe'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
